<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bubbly - 3D Bubble Visualizer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 20px Green Brick Window Frame -->
    <div class="window-frame"></div>

    <!-- Sky & Cloud background layer -->
    <div class="sky">
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
      <div class="cloud cloud3"></div>
    </div>

    <!-- UI Overlay -->
    <div id="ui">
      <button id="spawn-btn">✨ Spawn Bubble</button>
      <button id="tool-btn" class="hidden"></button>
    </div>

    <!-- Victory Screen Overlay -->
    <div id="victory-screen" class="hidden">
      <canvas id="confetti-canvas"></canvas>
      <div class="victory-card">
        <h1>🎉 Congratulations! 🎉</h1>
        <p>You have completed Bubbly</p>
        <button id="restart-btn">Play Again</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
